name = "antigravity-earthmover-worker"
main = "src/index.ts"
compatibility_date = "2026-05-27"

compatibility_flags = ["nodejs_compat"]

[vars]
ENABLE_REAL_THINKING = "true"
STREAM_THINKING_AS_CONTENT = "true"
# GEMINI_SAFETY_THRESHOLD = "BLOCK_NONE"

# --- Cloudflare KV Databases ---
# Create this in your Cloudflare Dashboard and paste the ID below to enable Multi-Account pooling and token caching

[[kv_namespaces]]
binding = "ACCOUNTS_KV"
id = "29023f2c821a4ea18c1f8c18b70f6eac"


# --- Local Development Configuration ---
# This section configures local development with Docker and miniflare
[dev]
ip = "0.0.0.0"          # Bind to all interfaces for Docker access
port = 8787             # Port for local development server
# Note: --persist-to flag in Docker handles storage location

# wrangler.toml (wrangler v3.88.0^)
[observability.logs]
enabled = true
